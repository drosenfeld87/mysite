<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debbie Rosenfeld — Coming soon</title>
  <meta name="description" content="Portfolio of Debbie Rosenfeld, senior product designer in Toronto. Coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root { --bg:#060609; --ink:#E8E6E3; --muted:#9A9893; --line:#2A2A2E; --accent:#FF7A59; --accent2:#F5B451; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "JetBrains Mono", ui-monospace, monospace;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 clamp(24px, 6vw, 96px); position: relative; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; inset: -20vh -20vw; z-index: -1; pointer-events: none;
      background:
        radial-gradient(42vmax 42vmax at 18% 22%, rgb(255 122 89 / .16), rgb(255 122 89 / .05) 40%, transparent 72%),
        radial-gradient(48vmax 48vmax at 82% 68%, rgb(245 180 81 / .14), rgb(245 180 81 / .05) 40%, transparent 72%);
    }
    .tag {
      display: inline-block; transform: rotate(-2deg); align-self: flex-start;
      color: #5ED6E8; border: 1px solid rgb(94 214 232 / .45);
      padding: 6px 12px; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 28px; font-family: "Mona Sans", "Archivo Narrow", system-ui, sans-serif;
      font-weight: 500; font-stretch: 75%; font-variation-settings: "wdth" 75;
      font-size: clamp(56px, 12vw, 180px); line-height: .9; letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; margin: 0; }
    a { color: var(--ink); }
    a:hover { color: var(--accent); }
    footer { position: absolute; left: clamp(24px, 6vw, 96px); bottom: 32px; color: var(--muted); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
  </style>
</head>
<body>
  <span class="tag">Senior Product Designer</span>
  <h1>Debbie Rosenfeld.<br><span>Coming soon.</span></h1>
  <p>Toronto &middot; <a href="https://www.linkedin.com/in/debbie-rosenfeld" target="_blank" rel="noopener">LinkedIn</a></p>
  <footer>&copy; 2026</footer>
</body>
</html>
