name: Site checks

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the test browser
        run: |
          pip install playwright==1.63.0
          playwright install --with-deps chromium
      - name: Check every page (layout, accessibility, script errors, missing files)
        run: python tests/check_site.py
