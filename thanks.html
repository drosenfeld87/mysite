<!DOCTYPE html>
<html lang="en" class="scroll-smooth scroll-pt-16">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thanks — Deb Rosenfeld</title>
  <!-- Tailwind CSS v4 via CDN (no build step). For production you can
       switch to the Tailwind CLI later for a smaller, faster stylesheet. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Fonts: Mona Sans (headlines), Satoshi (body), JetBrains Mono (labels) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap">

  <!-- Design tokens: change colours and fonts here -->
  <style type="text/tailwindcss">
    @theme {
      --color-bg: #0E0E10;
      --color-surface: #17171A;
      --color-ink: #E8E6E3;
      --color-muted: #9A9893;
      --color-line: #2A2A2E;
      --color-accent: #7CFF4F;   /* green: highlights, links, buttons */
      --color-accent2: #FF3D8B;  /* pink: tags and small details */
      --font-sans: "Satoshi", system-ui, sans-serif;
      --font-display: "Mona Sans", "Archivo Narrow", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }
    @layer base {
      h1, h2, h3, .font-display {
        font-family: var(--font-display);
        font-stretch: 75%;
        font-variation-settings: "wdth" 75;
        letter-spacing: -0.01em;
      }
      ::selection { background: var(--color-accent); color: var(--color-bg); }
    }
  </style>
</head>
<body class="bg-bg text-ink font-sans leading-relaxed">

  <main class="max-w-3xl mx-auto px-6 py-24">
    <h1 class="text-4xl font-bold mb-3">Thanks for your message</h1>
    <p class="mb-6">I'll get back to you soon.</p>
    <a class="inline-block self-start px-6 py-3 border border-accent bg-accent text-bg font-medium hover:bg-transparent hover:text-accent cursor-pointer transition-colors" href="index.html">Back to home</a>
  </main>
</body>
</html>
